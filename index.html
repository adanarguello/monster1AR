<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Librerías base -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      #boton-inicio {
        position: absolute;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background-color: #111;
        color: #fff;
        border: 2px solid #fff;
        border-radius: 30px;
        font-family: sans-serif;
        font-size: 15px;
        font-weight: bold;
        z-index: 9999;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>
    <button id="boton-inicio">Toca para comenzar la magia</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./rompecabezas.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <!-- Carga el video -->
      <a-assets>
        <video id="video-ar" src="./animacion.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Proyecta el video (Con la altura ya ajustada a 2) -->
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video 
          src="#video-ar" 
          position="0 0 0" 
          width="1" 
          height="2" 
          rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const video = document.querySelector('#video-ar');
      const boton = document.querySelector('#boton-inicio');
      const target = document.querySelector('#target');

      // Autoriza la reproducción
      boton.addEventListener('click', () => {
        boton.style.display = 'none';
        video.play();
        video.pause(); 
      });

      // Reproduce al ver el cuadro
      target.addEventListener('targetFound', () => {
        video.play();
      });

      // Pausa al alejar el teléfono
      target.addEventListener('targetLost', () => {
        video.pause();
      });
    </script>
  </body>
</html>
